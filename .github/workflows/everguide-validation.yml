name: Everguide validation

on:
  push:
    branches:
      - stage1-overture-identity-provenance
    paths:
      - "platform/**"
      - ".github/workflows/everguide-validation.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/everguide-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everguide-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checks:
    name: Python and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/apps/web/package-lock.json

      - name: Install API dependencies
        run: python -m pip install -r platform/apps/api/requirements.txt

      - name: Install frontend dependencies
        working-directory: platform/apps/web
        run: npm ci

      - name: Run quick validation
        working-directory: platform
        run: bash scripts/validate.sh quick

      - name: Build frontend for production
        working-directory: platform/apps/web
        run: npm run build

      - name: Build and audit release archive
        working-directory: platform
        run: python scripts/package_release.py

      - name: Upload verified release package
        uses: actions/upload-artifact@v4
        with:
          name: everguide-release-${{ github.sha }}
          path: |
            platform/releases/everguide-v*.zip
            platform/releases/everguide-v*.zip.sha256
            platform/releases/everguide-v*.package-manifest.json
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Isolated Docker integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run isolated Docker validation
        working-directory: platform
        run: bash scripts/validate-docker.sh
